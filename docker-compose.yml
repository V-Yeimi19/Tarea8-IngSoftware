version: "3.9"
services:
  restaurant_service:
    build:
      context: .
      dockerfile: restaurant_service/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./shared:/app/shared

  rewards_service:
    build:
      context: .
      dockerfile: rewards_service/Dockerfile
    ports:
      - "8001:8001"
    env_file: .env
    volumes:
      - ./shared:/app/shared
      - ./data:/app/data

  notification_service:
    build:
      context: .
      dockerfile: notification_service/Dockerfile
    ports:
      - "8002:8002"
    env_file: .env
    volumes:
      - ./shared:/app/shared
